name: EAgent2
options:
  bundleIdPrefix: com.qweq-1
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  EAgent2:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EAgent2
    info:
      path: EAgent2/Info.plist
      properties:
        CFBundleDisplayName: "EAgent"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 通过「文件」App 访问 App 内工作区（对应原版「选择工作目录」）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: "EAgent 需要定位来查询你当地的天气与位置信息"
        # 提醒事项 / 日历
        NSRemindersFullAccessUsageDescription: "EAgent 需要访问提醒事项，以便 DeepSeek 为你创建提醒"
        NSCalendarsFullAccessUsageDescription: "EAgent 需要访问日历，以便 DeepSeek 为你创建日程"
        NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.eagent2
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  EAgent2Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EAgent2Tests
    dependencies:
      - target: EAgent2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.eagent2.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EAgent2.app/EAgent2"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  EAgent2:
    build:
      targets:
        EAgent2: all
        EAgent2Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EAgent2Tests
